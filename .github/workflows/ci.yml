# فحص تلقائي (CI) عند كل تعديل على الفرع الرئيسي أو طلب دمج.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    name: فحص الصياغة والملفات (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: جلب الكود
        uses: actions/checkout@v4

      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: التحقق من صياغة كل ملفات JavaScript
        run: |
          for f in $(find src -name "*.js"); do
            echo "node --check $f"
            node --check "$f"
          done

      - name: التحقق من صحة package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json OK')"
